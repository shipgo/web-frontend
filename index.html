<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/favicon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#009688" />
    <!--
      Fallback estático de SEO/Open Graph para la landing pública (SHG-FE-044).

      Los crawlers que generan previews de links (Facebook, WhatsApp, Slack,
      X/Twitter, LinkedIn) no ejecutan JavaScript: sólo ven este HTML crudo tal
      cual lo sirve el hosting, nunca lo que `useDocumentMeta` inyecta en
      cliente vía `useEffect` (ver `src/features/landing/hooks/useDocumentMeta.js`).
      Por eso el copy de abajo está hardcodeado acá en vez de sólo vivir en
      `src/features/landing/constants/seo.js` — este archivo no pasa por el
      bundler de forma dinámica, así que hay que mantener ambos lugares en
      sync a mano si cambia el copy de SEO de la landing.
      `useDocumentMeta` sigue actualizando estos tags en runtime (no hace
      daño y ayuda si alguien navega dentro de la SPA), pero ya no es la
      única fuente: este bloque es lo que ven los crawlers sin JS.

      `og:image` (SHG-FE-055): foto de Unsplash del hero de la landing como
      interina — reemplaza el placeholder de `og:image` que dejó SHG-FE-046
      (favicon 512x512, ver PR #128) apenas esa rama esté mergeada; si hay
      conflicto en este bloque al mergear, esta es la versión que gana.
      Sigue siendo interina: el owner la cambia por un asset de marca cuando
      lo tenga (ver crédito en `src/features/landing/constants/content.jsx`,
      `LANDING_HERO.image.credit`).
    -->
    <title>ShipGo — Envíos, viajes y seguimiento en vivo</title>
    <meta
      name="description"
      content="ShipGo centraliza la gestión de envíos y viajes de tu operación, con seguimiento en vivo para tus clientes. Ingresá, creá tu cuenta o rastreá un envío por código."
    />
    <meta property="og:title" content="ShipGo — Envíos, viajes y seguimiento en vivo" />
    <meta
      property="og:description"
      content="ShipGo centraliza la gestión de envíos y viajes de tu operación, con seguimiento en vivo para tus clientes. Ingresá, creá tu cuenta o rastreá un envío por código."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1566576721346-d4a3b4eaeb55?auto=format&fit=crop&q=80&w=1200&h=630"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
